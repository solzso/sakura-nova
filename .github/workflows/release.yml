name: Release

# Publishes to the VS Code Marketplace and Open VSX when you push a v* tag.
#
# Required repository secrets:
#   VSCE_PAT  - Azure DevOps personal access token with Marketplace > Manage scope
#   OVSX_PAT  - Open VSX access token (optional; the Open VSX step is skipped without it)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    # Job-level env, because the secrets context cannot be read from a step `if:`
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate themes
        run: npm run validate

      - name: Package extension
        run: npx vsce package --out sakura-nova.vsix

      - name: Upload .vsix as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakura-nova-vsix
          path: sakura-nova.vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath sakura-nova.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish sakura-nova.vsix --pat "$OVSX_PAT"

      - name: Attach .vsix to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: sakura-nova.vsix
          generate_release_notes: true
